spring:
  application:
    name: gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:15000}
        response-timeout: ${HTTP_CLIENT_RESPONSE_TIMEOUT:120s}
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth(?<segment>/?.*), /api/v1/auth$\{segment}

        - id: exam-service
          uri: lb://exam-service
          predicates:
            - Path=/api/exam/**
          filters:
            - RewritePath=/api/exam(?<segment>/?.*), /api/v1/exams$\{segment}

        - id: question-service
          uri: lb://question-service
          predicates:
            - Path=/api/question/**
          filters:
            - RewritePath=/api/question(?<segment>/?.*), /api/v1/questions$\{segment}

        - id: result-service
          uri: lb://result-service
          predicates:
            - Path=/api/result/**
          filters:
            - RewritePath=/api/result(?<segment>/?.*), /api/v1/results$\{segment}

        - id: class-service-health
          uri: lb://class-service
          predicates:
            - Path=/api/class/health
          filters:
            - RewritePath=/api/class/health, /health

        - id: class-service
          uri: lb://class-service
          predicates:
            - Path=/api/class/**
          filters:
            - RewritePath=/api/class(?<segment>/?.*), /api/v1$\{segment}

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notification/**
          filters:
            - RewritePath=/api/notification(?<segment>/?.*), /api/v1/notifications$\{segment}

        - id: result-service-results
          uri: lb://result-service
          predicates:
            - Path=/api/results/**
          filters:
            - RewritePath=/api/results(?<segment>/?.*), /api/v1/results$\{segment}
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET}

# Comma-separated origin patterns. Extra: any Origin whose host matches Host/X-Forwarded-Host is allowed (one-domain + Nginx).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
