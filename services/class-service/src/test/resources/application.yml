spring:
  datasource:
    url: jdbc:h2:mem:classdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

eureka:
  client:
    enabled: false

jwt:
  secret: test-secret-key-for-tests-min-32-chars-long-ok

app:
  rabbitmq:
    exchange: exam.events
    class-user-added-routing-key: class.user.added
