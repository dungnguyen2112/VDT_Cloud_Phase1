spring:
  datasource:
    url: jdbc:h2:mem:examdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    enabled: false

jwt:
  secret: test-secret-key-for-tests-min-32-chars-long-ok

app:
  internal:
    service-token: test-internal-token
  rabbitmq:
    exchange: exam.events
    exam-created-routing-key: exam.created
