server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/online_quiz?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      "[hibernate.format_sql]": true
      "[hibernate.dialect]": org.hibernate.dialect.MySQLDialect
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:exam.events}
    auth-user-registered-routing-key: ${RABBITMQ_AUTH_USER_REGISTERED_ROUTING_KEY:auth.user.registered}
    auth-user-registered-queue: ${RABBITMQ_AUTH_USER_REGISTERED_QUEUE:notification.auth.user.registered}
