# Docker Compose — Multi-container orchestration
# Run: docker compose up --build
# Docs: https://docs.docker.com/compose/

services:
  # ─── Eureka Service Registry (Service Discovery) ─
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "${EUREKA_PORT}:8761"
    networks:
      - warehouse-network
    volumes:
      - ./agents/opentelemetry-javaagent.jar:/agents/opentelemetry-javaagent.jar
    environment:
      JAVA_TOOL_OPTIONS: -javaagent:/agents/opentelemetry-javaagent.jar -Xmx256m
      OTEL_SERVICE_NAME: eureka-server
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─── Auth DB ─────────────────────────────────────
  auth-db:
    image: mysql:8.4
    container_name: auth-db
    restart: always
    command: --performance_schema=OFF --innodb_buffer_pool_size=16M
    ports:
      - "${AUTH_DB_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${AUTH_DB_NAME}
    volumes:
      - ./docs/database/auth_service_schema.sql:/docker-entrypoint-initdb.d/01-auth_service_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - warehouse-network

  # ─── Exam DB ─────────────────────────────────────
  exam-db:
    image: mysql:8.4
    container_name: exam-db
    restart: always
    command: --performance_schema=OFF --innodb_buffer_pool_size=16M
    ports:
      - "${EXAM_DB_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${EXAM_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${EXAM_DB_NAME}
    volumes:
      - ./docs/database/exam_service_schema.sql:/docker-entrypoint-initdb.d/01-exam_service_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - warehouse-network

  # ─── Question DB (isolated from exam/auth DB) ─
  question-db:
    image: mysql:8.4
    container_name: question-db
    restart: always
    command: --performance_schema=OFF --innodb_buffer_pool_size=16M
    ports:
      - "${QUESTION_DB_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${QUESTION_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${QUESTION_DB_NAME}
    volumes:
      - ./docs/database/question_quiz_schema.sql:/docker-entrypoint-initdb.d/01-question_quiz_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - warehouse-network

  # ─── Result DB ─────────────────────────────────────
  result-db:
    image: mysql:8.4
    container_name: result-db
    restart: always
    command: --performance_schema=OFF --innodb_buffer_pool_size=16M
    ports:
      - "${RESULT_DB_PORT:-3309}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${RESULT_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${RESULT_DB_NAME}
    volumes:
      - ./docs/database/result_service_schema.sql:/docker-entrypoint-initdb.d/01-result_service_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - warehouse-network

  # ─── Class DB ────────────────────────────────────
  class-db:
    image: mysql:8.4
    container_name: class-db
    restart: always
    command: --performance_schema=OFF --innodb_buffer_pool_size=16M
    ports:
      - "${CLASS_DB_PORT:-3311}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${CLASS_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${CLASS_DB_NAME}
    volumes:
      - ./docs/database/class_service_schema.sql:/docker-entrypoint-initdb.d/01-class_service_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - warehouse-network

  # ─── Notification DB ─────────────────────────────
  notification-db:
    image: mysql:8.4
    container_name: notification-db
    restart: always
    command: --performance_schema=OFF --innodb_buffer_pool_size=16M
    ports:
      - "${NOTIFICATION_DB_PORT:-3312}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${NOTIFICATION_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${NOTIFICATION_DB_NAME}
    volumes:
      - ./docs/database/notification_service_schema.sql:/docker-entrypoint-initdb.d/01-notification_service_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - warehouse-network

  # ─── Redis ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: app-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - warehouse-network

  # ─── RabbitMQ ─────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - warehouse-network

  # ─── Auth Service ────────────────────────────────
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "${AUTH_SERVICE_PORT}:8081"
    volumes:
      - ./agents/opentelemetry-javaagent.jar:/agents/opentelemetry-javaagent.jar
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://auth-db:3306/${AUTH_DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: -javaagent:/agents/opentelemetry-javaagent.jar -Xmx256m
      OTEL_SERVICE_NAME: auth-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-db:
        condition: service_healthy
    networks:
      - warehouse-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 25
      start_period: 90s

  # ─── Exam Service ────────────────────────────────
  exam-service:
    build: ./services/exam-service
    container_name: exam-service
    expose:
      - "8082"
    volumes:
      - ./agents/opentelemetry-javaagent.jar:/agents/opentelemetry-javaagent.jar
    environment:
      SERVER_PORT: 8082
      SPRING_CACHE_TYPE: none
      DB_URL: jdbc:mysql://exam-db:3306/${EXAM_DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: -javaagent:/agents/opentelemetry-javaagent.jar -Xmx256m
      OTEL_SERVICE_NAME: exam-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      exam-db:
        condition: service_healthy
    networks:
      - warehouse-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 25
      start_period: 90s

  # ─── Question Service ────────────────────────────
  question-service:
    build: ./services/question-service
    container_name: question-service
    expose:
      - "8083"
    volumes:
      - ./agents/opentelemetry-javaagent.jar:/agents/opentelemetry-javaagent.jar
    environment:
      SERVER_PORT: 8083
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      DB_URL: jdbc:mysql://question-db:3306/${QUESTION_DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite-preview}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-60}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: -javaagent:/agents/opentelemetry-javaagent.jar -Xmx256m
      OTEL_SERVICE_NAME: question-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      question-db:
        condition: service_healthy
    networks:
      - warehouse-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 25
      start_period: 90s

  # ─── Result Service ────────────────────────────────
  result-service:
    build: ./services/result-service
    container_name: result-service
    expose:
      - "8084"
    volumes:
      - ./agents/opentelemetry-javaagent.jar:/agents/opentelemetry-javaagent.jar
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:mysql://result-db:3306/${RESULT_DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: -javaagent:/agents/opentelemetry-javaagent.jar -Xmx256m
      OTEL_SERVICE_NAME: result-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      result-db:
        condition: service_healthy
    networks:
      - warehouse-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 25
      start_period: 90s

  # ─── Notification Service ──────────────────────────
  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    expose:
      - "8086"
    volumes:
      - ./agents/opentelemetry-javaagent.jar:/agents/opentelemetry-javaagent.jar
    environment:
      SERVER_PORT: 8086
      JWT_SECRET: ${JWT_SECRET}
      DB_URL: jdbc:mysql://notification-db:3306/${NOTIFICATION_DB_NAME:-notification_service_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-E-Mid Quiz System}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: -javaagent:/agents/opentelemetry-javaagent.jar -Xmx256m
      OTEL_SERVICE_NAME: notification-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      notification-db:
        condition: service_healthy
    networks:
      - warehouse-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8086/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 25
      start_period: 90s

  # ─── Class Service ───────────────────────────────
  class-service:
    build: ./services/class-service
    container_name: class-service
    expose:
      - "8087"
    volumes:
      - ./agents/opentelemetry-javaagent.jar:/agents/opentelemetry-javaagent.jar
    environment:
      SERVER_PORT: 8087
      DB_URL: jdbc:mysql://class-db:3306/${CLASS_DB_NAME:-class_service_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: -javaagent:/agents/opentelemetry-javaagent.jar -Xmx256m
      OTEL_SERVICE_NAME: class-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      class-db:
        condition: service_healthy
    networks:
      - warehouse-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8087/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 25
      start_period: 90s

  # ─── API Gateway ─────────────────────────────────
  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "${GATEWAY_PORT}:8080"
    volumes:
      - ./agents/opentelemetry-javaagent.jar:/agents/opentelemetry-javaagent.jar
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      JAVA_TOOL_OPTIONS: -javaagent:/agents/opentelemetry-javaagent.jar -Xmx256m
      OTEL_SERVICE_NAME: gateway
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      exam-service:
        condition: service_healthy
      question-service:
        condition: service_healthy
      class-service:
        condition: service_healthy
      result-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - warehouse-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 25
      start_period: 90s

  # ─── Frontend ─
  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:3000"
    networks:
      - warehouse-network

  # ─── Fluent Bit (Log Forwarder to Loki) ───────────
  fluent-bit:
    image: fluent/fluent-bit:3.0
    container_name: fluent-bit
    restart: always
    user: root
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/containers:/var/log/containers:ro
      - /var/log/pods:/var/log/pods:ro
    networks:
      - warehouse-network

networks:
  warehouse-network:
    external: true
    name: warehouse-network
