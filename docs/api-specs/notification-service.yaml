openapi: 3.0.3
info:
  title: Notification Service API
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/v1/notifications/me:
    get:
      summary: List in-app notifications for the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Newest-first notification list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    NotificationListResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/NotificationItem"
    NotificationItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: string
        channel:
          type: string
        createdAt:
          type: string
          format: date-time
