version: '3.8'

services:
  # ─── GitLab CE (Self-Hosted Git Server) ───────────
  gitlab:
    image: 'gitlab/gitlab-ce:17.0.0-ce.0'
    container_name: gitlab
    restart: always
    hostname: '35.185.187.150'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://35.185.187.150'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
    ports:
      - '80:80'
      - '443:443'
      - '2222:22'
    volumes:
      - ./gitlab/config:/etc/gitlab
      - ./gitlab/logs:/var/log/gitlab
      - ./gitlab/data:/var/opt/gitlab
    networks:
      - warehouse-network

  # ─── Prometheus (Metrics Aggregation) ────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - warehouse-network

  # ─── Loki (Log Aggregation Server) ────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - warehouse-network

  # ─── Tempo (Distributed Tracing Server) ───────────
  tempo:
    image: grafana/tempo:2.4.0
    container_name: tempo
    restart: always
    command: -config.file=/etc/tempo/tempo-local.yaml
    ports:
      - "3200:3200"   # Tempo HTTP
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo-local.yaml
    networks:
      - warehouse-network

  # ─── Grafana (Visualization Dashboard) ────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"   # Expose Grafana on 3001 (Frontend is on 3000)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://35.185.187.150:3001/
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${MAIL_HOST}:${MAIL_PORT}
      - GF_SMTP_USER=${MAIL_USERNAME}
      - GF_SMTP_PASSWORD=${MAIL_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${MAIL_FROM_EMAIL}
      - GF_SMTP_FROM_NAME=${MAIL_FROM_NAME}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - warehouse-network

networks:
  warehouse-network:
    name: warehouse-network
    driver: bridge
