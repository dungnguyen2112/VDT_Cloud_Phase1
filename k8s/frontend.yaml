apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 35.185.187.150:8000/root/frontend:__TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: API_GATEWAY_UPSTREAM
              value: "http://gateway:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: frontend
