# ───────────────────────────────────────────────────────────────────────
# 1. LIÊN KẾT CƠ SỞ DỮ LIỆU AUTH (AUTH DATABASE ROUTING)
# ───────────────────────────────────────────────────────────────────────

# Định nghĩa một K8s Service không có selector (để tạo một Hostname ảo nội bộ)
apiVersion: v1
kind: Service
metadata:
  name: auth-db
spec:
  ports:
    - port: 3306      # Cổng giao tiếp ảo trong cụm K8s
---
# Định nghĩa Endpoint để trỏ Hostname ảo trên về IP của máy chủ vật lý bên ngoài
apiVersion: v1
kind: Endpoints
metadata:
  name: auth-db       # Tên phải trùng khớp 100% với tên Service ở trên
subsets:
  - addresses:
      - ip: HOST_IP   # Sẽ được tự động thay thế bằng IP nội bộ máy ảo GCP
    ports:
      - port: 3306    # Cổng MySQL của auth-db đang chạy trên Docker Host
---
# ───────────────────────────────────────────────────────────────────────
# 2. LIÊN KẾT CƠ SỞ DỮ LIỆU HỎI ĐÁP (QUESTION DATABASE)
