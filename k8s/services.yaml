# ───────────────────────────────────────────────────────────────────────
# 1. AUTH SERVICE
# ───────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 35.185.187.150:8000/root/auth-service:__TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: DB_URL
              value: "jdbc:mysql://auth-db:3306/auth_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: "root"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              value: "guest"
            - name: RABBITMQ_PASSWORD
              value: "guest"
            - name: JWT_SECRET
              value: "vdt_cloud_phase1_jwt_secret_key_long_enough_32_bytes"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server:8761/eureka/"
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/agents/opentelemetry-javaagent.jar -Xmx256m"
            - name: OTEL_SERVICE_NAME
              value: "auth-service"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo:4318"
          volumeMounts:
            - name: agents-volume
              mountPath: /agents
      volumes:
        - name: agents-volume
          hostPath:
            path: /home/nguyentridung20044/mid-project-135890-main/agents
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: LoadBalancer
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: auth-service

