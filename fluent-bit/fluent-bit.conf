# ───────────────────────────────────────────────────────────────────────
# CẤU HÌNH DỊCH VỤ CHUNG (GLOBAL SERVICE SETTINGS)
# ───────────────────────────────────────────────────────────────────────
[SERVICE]
    Flush        1             # Tần suất ghi log lên Loki (mỗi 1 giây 1 lần)
    Daemon       Off           # Chạy ở chế độ foreground để docker-compose quản lý logs
    Log_Level    info          # Mức độ log hệ thống của Fluent Bit
    Parsers_File parsers.conf  # Khai báo sử dụng bộ phân tích cú pháp bổ sung (parsers)

# ───────────────────────────────────────────────────────────────────────
# CÁC NGUỒN THU THẬP LOG (INPUTS)
# ───────────────────────────────────────────────────────────────────────

# 1. Đọc Log từ các Container chạy bằng Docker Compose trên Host
[INPUT]
    Name             tail
    Path             /var/lib/docker/containers/*/*.log
    Parser           docker    # Sử dụng parser docker để bóc tách luồng log
    Tag              docker.*
    Refresh_Interval 10
    Skip_Long_Lines  On

# 2. Đọc Log từ các Pods chạy bằng Kubernetes (K3s)
[INPUT]
    Name             tail
    Path             /var/log/containers/*.log
    Tag              k8s.*     # Gắn tag k8s để phân biệt nguồn log
    Refresh_Interval 10
    Skip_Long_Lines  On

# ───────────────────────────────────────────────────────────────────────
# BỘ LỌC VÀ CHUYỂN ĐỔI LOG (FILTERS)
# ───────────────────────────────────────────────────────────────────────

# Thực hiện parse (phân tích cú pháp) chuỗi text trong log thành dữ liệu cấu trúc JSON sạch
[FILTER]
    Name         parser
    Match        docker.*
    Key_Name     log
    Parser       json      # Ép định dạng logs sang JSON
    Reserve_Data True      # Giữ nguyên các trường dữ liệu metadata khác

# ───────────────────────────────────────────────────────────────────────
# ĐẦU RA ĐẨY LOG (OUTPUTS)
# ───────────────────────────────────────────────────────────────────────

# Đẩy toàn bộ logs thu thập được sang Loki Backend nội bộ cổng 3100
[OUTPUT]
    Name        loki
    Match       *
    Host        loki       # Container Name của Loki trong docker-compose
    Port        3100
    Labels      job=warehouse  # Gắn nhãn cứng để khi tìm trên Grafana dùng: {job="warehouse"}
