stages:
  - test
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  # Cấu hình Harbor Registry IP ngoài mới và tài khoản đăng nhập
  HARBOR_REGISTRY: "35.185.187.150:8000"
  HARBOR_USER: "admin"
  HARBOR_PASSWORD: "admin"
  # Cung cấp JWT_SECRET mặc định cho quá trình chạy test
  JWT_SECRET: "vdt_cloud_phase1_jwt_secret_key_long_enough_32_bytes"

cache:
  paths:
    - .m2/repository/

# ───────────────────────────────────────────────────────────────────────
# STAGE 1: KIỂM THỬ CHẤT LƯỢNG (TEST) - CHẠY NATIVE TRÊN MÁY CHỦ
# ───────────────────────────────────────────────────────────────────────

test-gateway:
  stage: test
  rules:
    - changes:
        - gateway/**/*
        - .gitlab-ci.yml
  script:
    - cd gateway
    - export JWT_SECRET="$JWT_SECRET"
    - mvn clean test

test-auth-service:
  stage: test
  rules:
    - changes:
        - services/auth-service/**/*
        - .gitlab-ci.yml
  script:
    - cd services/auth-service
    - export JWT_SECRET="$JWT_SECRET"
    - mvn clean test

test-class-service:
  stage: test
  rules:
    - changes:
        - services/class-service/**/*
        - .gitlab-ci.yml
  script:
    - cd services/class-service
    - export JWT_SECRET="$JWT_SECRET"
    - mvn clean test

test-exam-service:
  stage: test
  rules:
    - changes:
        - services/exam-service/**/*
        - .gitlab-ci.yml
  script:
    - echo "=================================================="
    - echo "🚀 Starting Quality Gate for exam-service..."
    - echo "=================================================="
    - cd services/exam-service
    
    # Chạy test native trực tiếp trên máy chủ
    - set +e
    - export JWT_SECRET="$JWT_SECRET"
    - mvn clean test
    - TEST_EXIT_CODE=$?
    - set -e
    
    # Custom Quality Gate logic
    - |
      if [ $TEST_EXIT_CODE -ne 0 ]; then
        echo ""
        echo "=================================================================="
        echo "❌ [QUALITY GATE FAILED]"
        echo "Reason: Logic test cases or coding convention violated (Exit code: $TEST_EXIT_CODE)."
        echo "Merging is BLOCKED. Please fix the failing tests before merging."
        echo "=================================================================="
        echo ""
        exit 1
      else
        echo ""
        echo "=================================================================="
        echo "✅ [QUALITY GATE PASSED]"
        echo "All tests passed successfully!"
        echo "Merging is ALLOWED."
        echo "=================================================================="
        echo ""
      fi

test-question-service:
  stage: test
  rules:
    - changes:
        - services/question-service/**/*
        - .gitlab-ci.yml
  script:
    - cd services/question-service
    - export JWT_SECRET="$JWT_SECRET"
