stages:
  - test
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  # Ở môi trường thực tế, 2 biến này sẽ được cấu hình ẩn trong giao diện Settings -> CI/CD -> Variables của GitLab.
  HARBOR_USER: "admin"
  HARBOR_PASSWORD: "admin"

cache:
  paths:
    - .m2/repository/

# ───────────────────────────────────────────────────────────────────────
# STAGE 1: KIỂM THỬ CHẤT LƯỢNG (TEST) - CHO CẢ 7 DỊCH VỤ
# ───────────────────────────────────────────────────────────────────────

test-gateway:
  stage: test
  image: maven:3.8.5-openjdk-17
  rules:
    - changes:
        - gateway/**/*
        - .gitlab-ci.yml
  script:
    - cd gateway
    - mvn clean test

test-auth-service:
  stage: test
  image: maven:3.8.5-openjdk-17
  rules:
    - changes:
        - services/auth-service/**/*
        - .gitlab-ci.yml
  script:
    - cd services/auth-service
    - mvn clean test

test-class-service:
  stage: test
  image: maven:3.8.5-openjdk-17
  rules:
    - changes:
        - services/class-service/**/*
        - .gitlab-ci.yml
  script:
    - cd services/class-service
    - mvn clean test

test-exam-service:
  stage: test
  image: maven:3.8.5-openjdk-17
  rules:
    - changes:
        - services/exam-service/**/*
        - .gitlab-ci.yml
  script:
    - echo "=================================================="
    - echo "🚀 Starting Quality Gate for exam-service..."
    - echo "=================================================="
    - cd services/exam-service
    
    # Run tests and intercept exit code
    - set +e
    - mvn clean test
    - TEST_EXIT_CODE=$?
    - set -e
    
    # Custom Quality Gate logic
    - |
      if [ $TEST_EXIT_CODE -ne 0 ]; then
        echo ""
        echo "=================================================================="
        echo "❌ [QUALITY GATE FAILED]"
        echo "Reason: Logic test cases or coding convention violated (Exit code: $TEST_EXIT_CODE)."
        echo "Merging is BLOCKED. Please fix the failing tests before merging."
        echo "=================================================================="
        echo ""
        exit 1
      else
        echo ""
        echo "=================================================================="
        echo "✅ [QUALITY GATE PASSED]"
        echo "All tests passed successfully!"
        echo "Merging is ALLOWED."
        echo "=================================================================="
        echo ""
      fi

test-question-service:
  stage: test
  image: maven:3.8.5-openjdk-17
  rules:
    - changes:
        - services/question-service/**/*
        - .gitlab-ci.yml
  script:
    - cd services/question-service
    - mvn clean test

test-result-service:
  stage: test
  image: maven:3.8.5-openjdk-17
  rules:
    - changes:
        - services/result-service/**/*
        - .gitlab-ci.yml
  script:
    - cd services/result-service
    - mvn clean test

test-notification-service:
  stage: test
  image: maven:3.8.5-openjdk-17
  rules:
    - changes:
        - services/notification-service/**/*
        - .gitlab-ci.yml
  script:
    - cd services/notification-service
    - mvn clean test

# ───────────────────────────────────────────────────────────────────────
# STAGE 2: ĐÓNG GÓI & ĐẨY ẢNH LÊN KHO CHỨA (BUILD & PUSH)
# ───────────────────────────────────────────────────────────────────────

build-gateway:
  stage: build
  rules:
    - changes:
        - gateway/**/*
        - .gitlab-ci.yml
  needs:
    - test-gateway
  script:
    - cd gateway
    - docker login -u "$HARBOR_USER" -p "$HARBOR_PASSWORD" localhost:8000
    - docker build -t localhost:8000/root/gateway:latest .
    - docker push localhost:8000/root/gateway:latest

