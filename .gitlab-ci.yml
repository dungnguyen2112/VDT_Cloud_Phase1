        - gateway/**/*
        - .gitlab-ci.yml
  needs:
    - build-gateway
  script:
    - export KUBECONFIG=~/.kube/config
    - cd /home/nguyentridung20044/mid-project-135890-main
    - git config --global --add safe.directory /home/nguyentridung20044/mid-project-135890-main || true
    - git config --global user.email "runner@gitlab.com"
    - git config --global user.name "GitLab Runner"
    - 'git remote set-url origin http://oauth2:${GIT_PUSH_TOKEN}@35.185.187.150/root/vdt_cloud_phase1.git || true'
    - git fetch origin main
    - git checkout main
    - git pull origin main
    - 'sed -i "s|image: 35.185.187.150:8000/root/gateway:.*|image: 35.185.187.150:8000/root/gateway:$CI_COMMIT_SHORT_SHA|g" k8s/gateway.yaml'
