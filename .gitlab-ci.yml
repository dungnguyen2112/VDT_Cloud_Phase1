deploy-gateway:
  stage: deploy
  rules:
    - changes:
        - gateway/**/*
        - .gitlab-ci.yml
  needs:
    - build-gateway
  script:
    - export KUBECONFIG=~/.kube/config
    - cd /home/nguyentridung20044/mid-project-135890-main
    - kubectl apply -f k8s/external-services.yaml
    - kubectl apply -f k8s/gateway.yaml
    - kubectl rollout restart deployment/gateway

deploy-auth-service:
