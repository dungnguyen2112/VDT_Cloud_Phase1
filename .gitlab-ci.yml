        - services/notification-service/**/*
        - .gitlab-ci.yml
  script:
    - cd services/notification-service
    - export JWT_SECRET="$JWT_SECRET"
    - mvn clean test

# ───────────────────────────────────────────────────────────────────────
# STAGE 2: ĐÓNG GÓI & ĐẨY ẢNH LÊN HARBOR XỊN
# ───────────────────────────────────────────────────────────────────────

build-gateway:
  stage: build
  rules:
    - changes:
        - gateway/**/*
        - .gitlab-ci.yml
  needs:
    - test-gateway
  script:
    - cd gateway
    - docker login -u "$HARBOR_USER" -p "$HARBOR_PASSWORD" "$HARBOR_REGISTRY"
    - docker build -t "$HARBOR_REGISTRY/root/gateway:$CI_COMMIT_SHORT_SHA" .
    - docker push "$HARBOR_REGISTRY/root/gateway:$CI_COMMIT_SHORT_SHA"

